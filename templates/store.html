{% extends "base.html" %}
{% block title %}New Enrollment — AccessGuard{% endblock %}

{% block content %}
<h2><i class="fas fa-user-plus"></i> New Enrollment</h2>

{% if error %}
<!-- Error Modal -->
<div class="modal fade" id="errorModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" style="background:#0a1f12; border:1px solid #ff4444; color:#fff;">
            <div class="modal-header" style="border-bottom:1px solid #ff4444;">
                <h5 class="modal-title" style="font-family:'Share Tech Mono',monospace; color:#ff4444;">
                    <i class="fas fa-exclamation-triangle"></i>&nbsp; ENROLLMENT FAILED
                </h5>
            </div>
            <div class="modal-body" style="font-family:'Share Tech Mono',monospace; font-size:0.95rem;">
                {{ error }}
            </div>
            <div class="modal-footer" style="border-top:1px solid #ff4444;">
                <button type="button" class="btn btn-danger" data-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        $('#errorModal').modal('show');
    });
</script>
{% endif %}

<form method="POST" id="storeForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="name"><i class="fas fa-id-card"></i> Full Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="Enter full name"
                       pattern="[A-Za-z\s\.\-']{2,80}" maxlength="80" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="rollno"><i class="fas fa-hashtag"></i> Roll Number</label>
                <input type="text" class="form-control" id="rollno" name="rollno"
                       placeholder="e.g. 21CS001"
                       pattern="[A-Za-z0-9\-/]{2,20}" maxlength="20" required>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="semester"><i class="fas fa-layer-group"></i> Semester</label>
                <input type="text" class="form-control" id="semester" name="semester"
                       placeholder="e.g. 6"
                       pattern="([1-9]|10)" maxlength="2" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="pincode"><i class="fas fa-lock"></i> Access PIN</label>
                <input type="password" class="form-control" id="pincode" name="pincode"
                       placeholder="Set a PIN (4–12 digits)"
                       pattern="\d{4,12}" minlength="4" maxlength="12" required>
            </div>
        </div>
    </div>

    <hr class="section-divider">

    <!-- Face capture -->
    <div class="form-group">
        <label><i class="fas fa-camera"></i> Face Scan</label>
        <div class="capture-row">
            <button type="button" class="btn btn-secondary" onclick="captureFaceData()">
                <i class="fas fa-camera"></i>&nbsp; Scan Face
            </button>
            <span id="faceStatus"></span>
        </div>
        <input type="hidden" id="face_data" name="face_data">
    </div>

    <!-- Voice capture -->
    <div class="form-group">
        <label><i class="fas fa-microphone"></i> Voice Sample</label>
        <div class="capture-row">
            <button type="button" class="btn btn-secondary" onclick="captureVoiceData()">
                <i class="fas fa-microphone"></i>&nbsp; Record Voice
            </button>
            <span id="voiceStatus"></span>
        </div>
        <input type="hidden" id="voice_data" name="voice_data">
    </div>

    <div id="voicePreview" style="display:none;" class="alert">
        <i class="fas fa-circle"></i>&nbsp; REC — SPEAK NOW...
    </div>

    <hr class="section-divider">

    <button type="submit" class="btn btn-primary btn-block" id="submitButton" disabled>
        <i class="fas fa-save"></i>&nbsp; Enroll Identity
    </button>
</form>
{% endblock %}
